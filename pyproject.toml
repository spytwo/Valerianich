[project]
name = "valerianich"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "C"]
ignore = ["E501", "B008"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
